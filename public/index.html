<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151918" />
    <meta
      name="description"
      content="为自己立下一份约定，连续履行，解锁奖励。"
    />
    <title>自我契约</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <div class="shell">
      <header class="header">
        <a class="wordmark" href="#home" aria-label="自我契约，返回当前契约"
          >自我契约<span class="wordmark-rule" aria-hidden="true"></span
        ></a>
        <nav aria-label="主要导航">
          <a href="#home">当前</a><a href="#records">记录</a
          ><a href="#settings">设置</a>
        </nav>
      </header>
      <div id="app">
        <main id="main"><p>正在读取你的契约…</p></main>
      </div>
      <footer class="footer">
        <span>一份约定，逐日履行。</span><span>记录保存在此浏览器</span>
      </footer>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog" aria-labelledby="dialog-title"></dialog>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
      aria-label="选择契约备份文件"
    />
    <noscript
      >此应用需要 JavaScript 才能在本机保存契约和打卡。请在浏览器设置中启用
      JavaScript。</noscript
    >
  </body>
</html>
